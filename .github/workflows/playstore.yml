name: Play Store Build

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch: # Allows manual trigger for Play Store builds

permissions:
  contents: read

jobs:
  build:
    name: Build Signed App Bundle (AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 -d > app/release.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Play Store AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundlePlaystoreRelease

      - name: Name the AAB
        id: aab
        run: |
          dir=app/build/outputs/bundle/playstoreRelease
          major=$(sed -n 's/^val appVersionMajor = //p' app/build.gradle.kts)
          minor=$(sed -n 's/^val appVersionMinor = //p' app/build.gradle.kts)
          patch=$(sed -n 's/^val appVersionPatch = //p' app/build.gradle.kts)
          name="app-playstore-release-$major.$minor.$patch.aab"
          mv "$dir"/*.aab "$dir/$name"
          echo "path=$dir/$name" >> "$GITHUB_OUTPUT"

      # archive: false uploads the bare .aab, not a zip. The artifact name is the file name.
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          path: ${{ steps.aab.outputs.path }}
          archive: false
          retention-days: 7
