syntax = "proto3";

package hcwebhook.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option java_multiple_files = true;
option java_package = "com.hcwebhook.app.proto.v1";
option java_outer_classname = "HealthPayloadProto";

// Mirrors the JSON webhook schema in docs/webhook.md, with protobuf-native
// refinements that the JSON format cannot express:
//   - record instants use google.protobuf.Timestamp, durations use
//     google.protobuf.Duration
//   - sample vs aggregate records use a oneof so both forms can never be set
//     on the same record
//   - RecordMetadata carries record identity (id, client_record_id,
//     client_record_version, last_modified_time) and the UTC offsets Health
//     Connect stores for server-side local-day aggregation
// Generate server stubs from this file in any gRPC language.

service HealthWebhook {
  // Unary deliver of one sync batch. Server should return ok=true on accept.
  rpc Deliver (HealthPayload) returns (DeliverResponse);
}

message DeliverResponse {
  bool ok = 1;
  string message = 2;
}

message HealthPayload {
  // ISO-8601 instant when the payload was built (envelope metadata, mirrors the
  // JSON envelope). Not the time range of the records below.
  string timestamp = 1;
  string app_version = 2;
  repeated StepsRecord steps = 3;
  repeated SleepRecord sleep = 4;
  repeated HeartRateRecord heart_rate = 5;
  repeated HeartRateVariabilityRecord heart_rate_variability = 6;
  repeated DistanceRecord distance = 7;
  repeated CaloriesRecord active_calories = 8;
  repeated CaloriesRecord total_calories = 9;
  repeated WeightRecord weight = 10;
  repeated HeightRecord height = 11;
  repeated BloodPressureRecord blood_pressure = 12;
  repeated BloodGlucoseRecord blood_glucose = 13;
  repeated OxygenSaturationRecord oxygen_saturation = 14;
  repeated TemperatureRecord body_temperature = 15;
  repeated SkinTemperatureRecord skin_temperature = 16;
  repeated RespiratoryRateRecord respiratory_rate = 17;
  repeated RestingHeartRateRecord resting_heart_rate = 18;
  repeated ExerciseRecord exercise = 19;
  repeated HydrationRecord hydration = 20;
  repeated NutritionRecord nutrition = 21;
  repeated BasalMetabolicRateRecord basal_metabolic_rate = 22;
  repeated BodyFatRecord body_fat = 23;
  repeated MassRecord lean_body_mass = 24;
  repeated MassRecord body_water_mass = 25;
  repeated BmiRecord bmi = 26;
  repeated Vo2MaxRecord vo2_max = 27;
  repeated MassRecord bone_mass = 28;
  repeated MenstruationFlowRecord menstruation_flow = 29;
  repeated MenstruationPeriodRecord menstruation_period = 30;
  repeated IntermenstrualBleedingRecord intermenstrual_bleeding = 31;
  repeated OvulationTestRecord ovulation_test = 32;
  repeated CervicalMucusRecord cervical_mucus = 33;
  repeated SexualActivityRecord sexual_activity = 34;
  repeated BasalBodyTemperatureRecord basal_body_temperature = 35;
}

message RecordMetadata {
  string data_origin = 1;
  string recording_method = 2;
  optional string device_manufacturer = 3;
  optional string device_model = 4;
  optional int32 device_type = 5;

  // Stable Health Connect record id. Use for deduplication.
  string id = 6;
  // Writer-assigned id, for correlating this record with the source app's own
  // records (e.g. native Google Health / Fitbit entries).
  optional string client_record_id = 7;
  // Writer-assigned version. When the same client_record_id is re-sent, the
  // higher version is the newer state.
  int64 client_record_version = 8;
  // When Health Connect last modified this record.
  google.protobuf.Timestamp last_modified_time = 9;

  // UTC offset(s) Health Connect stores for this record. A record is either an
  // instant record or an interval record, never both, so this is a oneof.
  oneof zone_offset {
    // In effect at the record's instant, for instant records.
    sint32 instant_zone_offset_seconds = 10;
    // In effect at the interval bounds, for interval records.
    IntervalZoneOffset interval_zone_offset = 11;
  }
}

message IntervalZoneOffset {
  optional sint32 start_zone_offset_seconds = 1;
  optional sint32 end_zone_offset_seconds = 2;
}

message StepsRecord {
  int64 count = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  optional RecordMetadata metadata = 4;
}

message SleepStage {
  string stage = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  google.protobuf.Duration duration = 4;
}

message SleepRecord {
  google.protobuf.Timestamp session_end_time = 1;
  google.protobuf.Duration duration = 2;
  repeated SleepStage stages = 3;
  optional RecordMetadata metadata = 4;
}

message HeartRateSample {
  int64 bpm = 1;
}

message HeartRateAggregate {
  int64 avg = 1;
  int64 min = 2;
  int64 max = 3;
}

message HeartRateRecord {
  google.protobuf.Timestamp time = 1;
  oneof value {
    HeartRateSample sample = 2;
    HeartRateAggregate aggregate = 3;
  }
  optional RecordMetadata metadata = 4;
}

message HeartRateVariabilitySample {
  double rmssd_millis = 1;
}

message HeartRateVariabilityAggregate {
  double avg = 1;
  double min = 2;
  double max = 3;
}

message HeartRateVariabilityRecord {
  google.protobuf.Timestamp time = 1;
  oneof value {
    HeartRateVariabilitySample sample = 2;
    HeartRateVariabilityAggregate aggregate = 3;
  }
  optional RecordMetadata metadata = 4;
}

message DistanceRecord {
  double meters = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  optional RecordMetadata metadata = 4;
}

message CaloriesRecord {
  double calories = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  optional RecordMetadata metadata = 4;
}

message WeightRecord {
  double kilograms = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message HeightRecord {
  double meters = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message BloodPressureRecord {
  double systolic = 1;
  double diastolic = 2;
  google.protobuf.Timestamp time = 3;
  optional RecordMetadata metadata = 4;
}

message BloodGlucoseRecord {
  double mmol_per_liter = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message OxygenSaturationSample {
  double percentage = 1;
}

message OxygenSaturationAggregate {
  double avg = 1;
  double min = 2;
  double max = 3;
}

message OxygenSaturationRecord {
  google.protobuf.Timestamp time = 1;
  oneof value {
    OxygenSaturationSample sample = 2;
    OxygenSaturationAggregate aggregate = 3;
  }
  optional RecordMetadata metadata = 4;
}

message TemperatureRecord {
  double celsius = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message SkinTemperatureSample {
  double delta_celsius = 1;
}

message SkinTemperatureAggregate {
  double avg_delta_celsius = 1;
  double min_delta_celsius = 2;
  double max_delta_celsius = 3;
}

message SkinTemperatureRecord {
  google.protobuf.Timestamp time = 1;
  oneof value {
    SkinTemperatureSample sample = 2;
    SkinTemperatureAggregate aggregate = 3;
  }
  optional double baseline_celsius = 4;
  int32 measurement_location = 5;
  optional RecordMetadata metadata = 6;
}

message RespiratoryRateSample {
  double rate = 1;
}

message RespiratoryRateAggregate {
  double avg = 1;
  double min = 2;
  double max = 3;
}

message RespiratoryRateRecord {
  google.protobuf.Timestamp time = 1;
  oneof value {
    RespiratoryRateSample sample = 2;
    RespiratoryRateAggregate aggregate = 3;
  }
  optional RecordMetadata metadata = 4;
}

message RestingHeartRateRecord {
  int64 bpm = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message ExerciseRecord {
  string type = 1;
  optional string title = 2;
  google.protobuf.Timestamp start_time = 3;
  google.protobuf.Timestamp end_time = 4;
  google.protobuf.Duration duration = 5;
  optional double distance_meters = 6;
  optional int64 steps = 7;
  optional double avg_cadence_spm = 8;
  optional double max_cadence_spm = 9;
  optional double stride_length_m = 10;
  optional RecordMetadata metadata = 11;
}

message HydrationRecord {
  double liters = 1;
  google.protobuf.Timestamp start_time = 2;
  google.protobuf.Timestamp end_time = 3;
  optional RecordMetadata metadata = 4;
}

message NutritionRecord {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  optional double calories = 3;
  optional double protein_grams = 4;
  optional double carbs_grams = 5;
  optional double fat_grams = 6;
  optional double sugar_grams = 7;
  optional double sodium_grams = 8;
  optional double dietary_fiber_grams = 9;
  optional string name = 10;
  optional RecordMetadata metadata = 11;
}

message BasalMetabolicRateRecord {
  double watts = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message BodyFatRecord {
  double percentage = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message MassRecord {
  double kilograms = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message BmiRecord {
  double value = 1;
  google.protobuf.Timestamp time = 2;
  double weight_kg = 3;
  double height_meters = 4;
}

message Vo2MaxRecord {
  double ml_per_kg_per_min = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message MenstruationFlowRecord {
  int32 flow = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message MenstruationPeriodRecord {
  google.protobuf.Timestamp start_time = 1;
  google.protobuf.Timestamp end_time = 2;
  optional RecordMetadata metadata = 3;
}

message IntermenstrualBleedingRecord {
  google.protobuf.Timestamp time = 1;
  optional RecordMetadata metadata = 2;
}

message OvulationTestRecord {
  int32 result = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message CervicalMucusRecord {
  int32 appearance = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message SexualActivityRecord {
  int32 protection_used = 1;
  google.protobuf.Timestamp time = 2;
  optional RecordMetadata metadata = 3;
}

message BasalBodyTemperatureRecord {
  double celsius = 1;
  int32 measurement_location = 2;
  google.protobuf.Timestamp time = 3;
  optional RecordMetadata metadata = 4;
}
